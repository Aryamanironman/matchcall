<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Commentary Dubber</title>
<style>
  :root {
    --bg: #0a0e17; --panel: #111827; --panel2: #0d1420; --line: #1f2937;
    --text: #e5e7eb; --dim: #94a3b8; --green: #22c55e; --accent: #38bdf8;
    --amber: #fbbf24; --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #14213a 0%, var(--bg) 55%);
    color: var(--text); min-height: 100vh; padding: 28px 20px 60px;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 24px; }
  h1 { font-size: 26px; letter-spacing: .5px; }
  h1 .live-dot { color: var(--green); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% {opacity: 1} 50% {opacity: .35} }
  .sub { color: var(--dim); font-size: 14px; }
  .grid { display: grid; grid-template-columns: 5fr 7fr; gap: 18px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel2) 100%);
    border: 1px solid var(--line); border-radius: 14px; padding: 20px;
  }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px;
             color: var(--dim); margin-bottom: 14px; }
  #drop {
    border: 2px dashed #2b3b52; border-radius: 12px; padding: 30px 16px;
    text-align: center; color: var(--dim); cursor: pointer; transition: .15s;
  }
  #drop.hover { border-color: var(--accent); background: rgba(56,189,248,.06); }
  #drop b { color: var(--text); }
  input[type=file] { display: none; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .row input {
    flex: 1; background: #0b1220; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font-size: 14px; min-width: 0;
  }
  .row input:focus { outline: 1px solid var(--accent); }
  .row2 { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
  .row2 label { font-size: 13px; color: var(--dim); }
  .row2 input { width: 80px; background: #0b1220; border: 1px solid var(--line);
                color: var(--text); border-radius: 8px; padding: 8px 10px; }
  button.go {
    width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 10px;
    background: linear-gradient(90deg, #16a34a, #22c55e); color: #04120a;
    font-weight: 700; font-size: 15px; cursor: pointer; letter-spacing: .4px;
  }
  button.go:disabled { opacity: .45; cursor: wait; }
  button.ghost {
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .stage-label { font-size: 13px; color: var(--dim); margin: 14px 0 6px; }
  .bar { height: 10px; background: #0b1220; border: 1px solid var(--line);
         border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0%;
    background: linear-gradient(90deg, #0ea5e9, #22c55e); transition: width .4s; }
  #log {
    background: #060a12; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; height: 210px; overflow-y: auto; font: 12px/1.55 ui-monospace,
    'Cascadia Code', Consolas, monospace; color: #7dd3fc; white-space: pre-wrap;
    margin-top: 12px;
  }
  #log .err { color: var(--red); }
  #transcript { margin-top: 14px; max-height: 340px; overflow-y: auto; }
  .tline { padding: 8px 10px; border-left: 3px solid #233246; margin-bottom: 6px;
           background: rgba(255,255,255,.02); border-radius: 0 8px 8px 0;
           font-size: 14px; line-height: 1.5; animation: fadein .3s; }
  @keyframes fadein { from {opacity: 0; transform: translateY(4px)} to {opacity: 1} }
  .tline .ts { color: var(--green); font-family: ui-monospace, monospace;
               font-size: 12px; margin-right: 8px; }
  .tline .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; margin-right: 8px; }
  .tag.goal  { background: #7f1d1d; color: #fecaca; }
  .tag.shot  { background: #78350f; color: #fde68a; }
  .tag.tackle{ background: #1e3a8a; color: #bfdbfe; }
  .tag.pass  { background: #14532d; color: #bbf7d0; }
  .tag.ambience, .tag.dead_time { background: #374151; color: #d1d5db; }
  #player { width: 100%; border-radius: 10px; margin-top: 12px; background: black;
            max-height: 430px; }
  #dl { display: inline-block; margin-top: 12px; color: var(--accent);
        text-decoration: none; font-size: 14px; }
  #dl:hover { text-decoration: underline; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
  .stat { background: #0b1220; border: 1px solid var(--line); border-radius: 10px;
          padding: 10px 14px; min-width: 110px; }
  .stat .v { font-size: 18px; font-weight: 700; color: var(--accent); }
  .stat .k { font-size: 11px; color: var(--dim); text-transform: uppercase;
             letter-spacing: 1px; }
  .empty { color: var(--dim); font-size: 14px; padding: 20px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚽ Commentary Dubber <span class="live-dot">●</span></h1>
    <span class="sub">upload a match clip → AI commentator → dubbed video</span>
  </header>

  <div class="grid">
    <div class="card">
      <h2>1 · Upload</h2>
      <div id="drop">
        <b>Drop a video</b> or click to choose<br>
        <span style="font-size:12px">mp4 / mov / mkv — processed locally on your GPU</span>
      </div>
      <input type="file" id="file" accept="video/*">
      <div class="row">
        <input id="home" placeholder="Home team" value="Home">
        <input id="away" placeholder="Away team" value="Away">
      </div>
      <div class="row2">
        <label>Start</label><input id="t0" type="number" min="0" step="1" value="0">
        <label>Length (s)</label><input id="dur" type="number" min="0" step="1" placeholder="full">
        <label class="chk" style="display:flex;align-items:center;gap:6px;margin-left:auto">
          <input type="checkbox" id="orig" checked> keep crowd noise
        </label>
      </div>
      <button class="go" id="go">Generate commentary</button>
      <div class="stage-label" id="stageLabel" style="display:none"></div>
      <div class="bar" id="barWrap" style="display:none"><div id="bar"></div></div>
      <div id="log" style="display:none"></div>
    </div>

    <div class="card">
      <h2>2 · Result</h2>
      <div id="resultEmpty" class="empty">Run a job to see the dubbed video and live transcript here.</div>
      <div id="result" style="display:none">
      <div id="playerCaption" style="font-size:12px;color:var(--dim);margin-bottom:6px"></div>
      <video id="player" controls></video>
        <div class="stats" id="stats"></div>
        <a id="dl" href="#" download style="display:none">⬇ Download dubbed video</a>
        <button id="replay" style="display:none;margin-left:8px">↻ Replay with commentary</button>
        <h2 style="margin-top:18px">Live transcript</h2>
        <div id="transcript"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let jobId = null, poll = null, localUrl = null;

const drop = $('drop'), fileIn = $('file');
drop.onclick = () => fileIn.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('hover'); };
drop.ondragleave = () => drop.classList.remove('hover');
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove('hover');
  if (e.dataTransfer.files.length) { fileIn.files = e.dataTransfer.files; showFile(); }
};
fileIn.onchange = showFile;
function showFile() {
  if (fileIn.files.length)
    drop.innerHTML = `<b>${fileIn.files[0].name}</b><br><span style="font-size:12px">${(fileIn.files[0].size/1e6).toFixed(1)} MB — click to change</span>`;
}

$('go').onclick = async () => {
  if (!fileIn.files.length) { alert('choose a video first'); return; }
  const fd = new FormData();
  fd.append('file', fileIn.files[0]);
  fd.append('home', $('home').value || 'Home');
  fd.append('away', $('away').value || 'Away');
  fd.append('t0', $('t0').value || 0);
  fd.append('dur', $('dur').value || '');
  fd.append('orig_audio', $('orig').checked);
  $('go').disabled = true; $('go').textContent = 'Processing…';
  $('log').style.display = 'block'; $('log').textContent = '';
  $('barWrap').style.display = 'block'; $('bar').style.width = '0%';
  $('stageLabel').style.display = 'block';
  // LIVE mode: the original clip plays NOW; commentary lines stream in over SSE
  // and are spoken at their timestamps, exactly like a live broadcast.
  stopLive();
  if (localUrl) URL.revokeObjectURL(localUrl);
  localUrl = URL.createObjectURL(fileIn.files[0]);
  $('player').src = localUrl;
  $('resultEmpty').style.display = 'none';
  $('result').style.display = 'block';
  $('playerCaption').textContent = '● LIVE — commentary is generated and spoken as the clip plays';
  $('player').play().catch(() => {});
  try {
    const r = await fetch('/api/upload', { method: 'POST', body: fd });
    if (!r.ok) throw new Error(await r.text());
    ({ job_id: jobId } = await r.json());
    poll = setInterval(tick, 1500);
    startLive();
  } catch (err) {
    $('playerCaption').textContent = '✘ upload failed — fix and retry (video stays playable locally)';
    alert('upload failed: ' + err.message); resetBtn();
  }
};

function resetBtn() {
  $('go').disabled = false; $('go').textContent = 'Generate commentary';
}

function esc(s) {
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

async function tick() {
  try {
    const r = await fetch('/api/job/' + jobId);
    if (r.status === 404) { clearInterval(poll); resetBtn(); return; }
    const j = await r.json();
    $('bar').style.width = (j.progress * 100).toFixed(1) + '%';
    $('stageLabel').textContent = `Stage: ${j.stage} — ${j.message || ''}`;
    const log = $('log');
    log.textContent = j.log.join('\n');
    log.scrollTop = log.scrollHeight;
    const lines = j.log.filter(l => l.startsWith('ERROR'));
    if (lines.length) lines.forEach(l => log.insertAdjacentHTML('beforeend', `<div class="err">${esc(l)}</div>`));

    // transcript
    const tr = $('transcript');
    if (j.transcript && j.transcript.length) {
      $('resultEmpty').style.display = 'none';
      $('result').style.display = 'block';
      tr.innerHTML = j.transcript.map(t => {
        const m = t.match(/^\[(\d+:\d+)\] \(([^|)]+)\s*\|\s*([^)]+)\)\s*(.*)$/);
        if (!m) return `<div class="tline">${esc(t)}</div>`;
        const [, ts, tag, exc, text] = m;
        return `<div class="tline"><span class="ts">${ts}</span><span class="tag ${tag}">${tag}${tag !== exc ? ' · ' + exc : ''}</span>${esc(text)}</div>`;
      }).join('');
      tr.scrollTop = tr.scrollHeight;
    }

    if (j.status === 'done' && j.video_url) {
      clearInterval(poll);
      $('dl').href = j.video_url;
      $('dl').style.display = 'inline-block';
      $('replay').style.display = 'inline-block';
      $('playerCaption').textContent = allSegs.length
        ? '✔ complete — dubbed MP4 ready to download, or ↻ replay the full live session'
        : '✔ complete — dubbed MP4 ready to download';
      $('stageLabel').textContent = 'Done — final video ready';
      if (j.result) {
        const s = j.result;
        $('stats').innerHTML =
          stat('clip', fmtDur(s.clip_duration_s)) + stat('lines', s.segments) +
          stat('speech', fmtDur(s.speech_seconds)) +
          stat('speed', s.realtime_ratio + '× realtime') +
          (s.net_classifier_used ? stat('classifier', 'ResNet18') : '');
      }
      resetBtn();
    }
    if (j.status === 'error' || j.status === 'cancelled') {
      clearInterval(poll);
      $('stageLabel').textContent = j.status === 'error' ? ('Failed: ' + j.error) : 'Cancelled';
      stopLive();
      resetBtn();
    }
  } catch (e) { /* transient poll error — keep trying */ }
}

/* ---- live commentary: SSE + timestamp scheduler ---- */
let liveES = null, liveQueue = [], liveTimer = null;

function startLive() {
  liveES = new EventSource(`/api/job/${jobId}/live`);
  liveES.onmessage = e => {
    liveQueue.push(JSON.parse(e.data));
    if (!liveTimer) liveTimer = setInterval(pumpLive, 250);
  };
  liveES.addEventListener('end', () => { liveES?.close(); liveES = null; });
}

function pumpLive() {
  const now = $('player').currentTime;
  liveQueue = liveQueue.filter(seg => {
    if (now >= seg.t0 - 0.15) {
      if (now - seg.t0 < 6) playSeg(seg);   // speak it (slightly late is fine)
      return false;                          // else: too far past — replay button covers it
    }
    return true;
  });
  if (!liveQueue.length && !liveES) { clearInterval(liveTimer); liveTimer = null; }
}

function playSeg(seg) {
  const a = new Audio(seg.audio_url);
  a.play().catch(() => {});
  const ts = fmtDur(seg.t0);
  const cap = $('playerCaption');
  cap.textContent = `🔊 [${ts}] ${seg.text}`;
  a.onended = () => { if (cap.textContent.startsWith('🔊')) cap.textContent = '● LIVE — commentary is generated and spoken as the clip plays'; };
}

function stopLive() {
  liveES?.close(); liveES = null;
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  liveQueue = [];
}

// once the job finishes, offer a clean from-0 replay with all collected lines
$('replay').onclick = () => {
  stopLive();
  liveQueue = allSegs.slice();
  liveTimer = setInterval(pumpLive, 250);
  $('player').currentTime = 0;
  $('player').play().catch(() => {});
  $('playerCaption').textContent = '● replay — full commentary, in sync';
};
let allSegs = [];
const _origPlaySeg = playSeg;
playSeg = function (seg, record = true) {
  if (record) allSegs.push(seg);
  _origPlaySeg(seg);
};

$('player').addEventListener('ended', stopLive);

// attach to an existing job via ?job=<id> (e.g. a job started server-side):
// streams the original from the server and goes live on its commentary
const urlJob = new URLSearchParams(location.search).get('job');
if (urlJob) {
  jobId = urlJob;
  (async () => {
    try {
      const j = await (await fetch('/api/job/' + jobId)).json();
      if (j.file) {
        $('player').src = '/media/uploads/' + encodeURIComponent(j.file);
        $('resultEmpty').style.display = 'none';
        $('result').style.display = 'block';
        $('playerCaption').textContent = '● LIVE (attached) — commentary is generated and spoken as the clip plays';
        $('player').play().catch(() => {});
      }
      $('go').disabled = true; $('go').textContent = 'Processing…';
      $('log').style.display = 'block'; $('barWrap').style.display = 'block';
      $('stageLabel').style.display = 'block';
      poll = setInterval(tick, 1500);
      startLive();
    } catch (e) { alert('cannot attach to job ' + jobId); }
  })();
}

function stat(k, v) { return `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`; }
function fmtDur(s) {
  s = Math.round(s || 0);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
</script>
</body>
</html>
